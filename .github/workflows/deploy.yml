name: Build and Deploy to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

# Grant necessary permissions for GitHub Pages OIDC deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one active deployment, cancelling in-progress runs
concurrency:
  group: "pages"
  cancel-in-progress: true

# Suppress runner transition warning cleanly
env:
  ACTIONS_RUNNER_FORCE_NODE24: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      # 1. 소스 체크아웃
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 가장 검증된 Node.js 22 Active LTS 환경 설정 (프로젝트 안전성 최우선)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # 3. 의존성 설치
      - name: Install dependencies
        run: npm ci

      # 4. 정적 사이트 빌드
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_COUPANG_LOOKUP_ENDPOINT: ${{ vars.COUPANG_LOOKUP_ENDPOINT }}

      # 5. GitHub Pages 환경 설정
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 6. 빌드 파일 진단
      - name: Show built files
        run: |
          echo "Files in out:"
          ls -la out || true
          du -sh out || true

      # 7. 빌드 결과물 아티팩트 업로드
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

      # 8. GitHub Pages 정식 배포
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # 9. 검색엔진 실시간 자동 핑 (IndexNow: Bing, Naver, Yandex, Perplexity)
      - name: Submit to IndexNow
        run: node files/gen/submit-indexnow.js
        continue-on-error: true
